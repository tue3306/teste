<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>BI&amp;B — Voo, hotel e passeio numa busca só</title>
    <meta
      name="description"
      content="A BI&amp;B varre companhias aéreas, hospedagens, passeios, restaurantes, eventos e locadoras nos 29 destinos do Rio de Janeiro, compara tudo lado a lado e fecha o orçamento da viagem."
    />
    <link rel="canonical" href="https://bib.com.br/" />
    <meta name="theme-color" content="#FBF6EE" />
    <meta name="color-scheme" content="light" />

    <!--
      Preferência de movimento, resolvida antes da primeira pintura.

      Precisa ser embutido e síncrono: se esperasse o React montar, a página
      apareceria com a amplitude cheia por um instante antes de ser corrigida.
      Todo o CSS depende do atributo `data-motion`, e não da media query direto,
      para que exista uma fonte de verdade só entre folha de estilo e script.

      `reduzido` contém a amplitude — não desliga o movimento. Ver
      `src/hooks/useMovimento.ts`.
    -->
    <script>
      ;(function () {
        try {
          document.documentElement.dataset.motion = matchMedia(
            '(prefers-reduced-motion: reduce)',
          ).matches
            ? 'reduzido'
            : 'ok'
        } catch (e) {
          document.documentElement.dataset.motion = 'ok'
        }
      })()
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
